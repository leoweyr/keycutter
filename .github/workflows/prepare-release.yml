name: Prepare Release


on:
  push:
    tags:
      - 'v*'
      - '*/v*'


permissions:
  contents: write
  pull-requests: write


jobs:
  call-prepare:
    uses: leoweyr/github-release-workflow/.github/workflows/reusable-prepare-release.yml@develop

    with:
      packages: |
        {
          "go": "go",
          "ts": "ts",
          "cli": "cli"
        }

    secrets:
      ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
